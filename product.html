<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Arewa Herbal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Arial, sans-serif;
}

body{
  background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
  background-size: cover;
  min-height:100vh;
  padding:40px 20px;
}

.header{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  color:#fff;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  margin-bottom:40px;
  border-radius:15px;
}

.back-btn{
  color:#fff;
  text-decoration:none;
  font-size:16px;
  font-weight:600;
}

.back-btn:hover{
  color:#ffeb3b;
}

.product-container{
  max-width:900px;
  margin:0 auto;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border-radius:20px;
  border: 1px solid rgba(255,255,255,0.3);
  padding:40px;
  color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.product-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:start;
}

.product-img{
  width:100%;
  border-radius:15px;
  border:2px solid rgba(255,255,255,0.3);
}

.product-info h1{
  font-size:32px;
  margin-bottom:15px;
}

.price{
  font-size:40px;
  color:#ffeb3b;
  font-weight:bold;
  margin-bottom:25px;
}

.section{
  margin-bottom:25px;
}

.section h3{
  font-size:18px;
  margin-bottom:10px;
  color:#ffeb3b;
}

.section p{
  font-size:16px;
  line-height:1.7;
  color:rgba(255,255,255,0.95);
}

.buy-btn{
  width:100%;
  padding:16px;
  background:rgba(80,80,80,0.6);
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:10px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  margin-top:20px;
}

.buy-btn:hover{
  background:rgba(100,100,100,0.8);
}

@media(max-width:768px){
  .product-grid{grid-template-columns:1fr;}
  .product-info h1{font-size:26px;}
}
</style>
</head>
<body>

<div class="header">
  <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Shop</a>
  <div><i class="fa-solid fa-leaf"></i> Arewa Herbal Mixture</div>
</div>

<div class="product-container" id="productContainer">
  <!-- Product details load here -->
</div>

<script>
const params = new URLSearchParams(window.location.search);

const name = params.get('name') || 'Product';
const price = params.get('price') || '0';
const img = params.get('img') || '';
const desc = params.get('desc') || 'No description available';
const ingredients = params.get('ingredients') || 'Natural herbs';
const usage = params.get('usage') || 'Follow instructions on bottle';

document.getElementById('productContainer').innerHTML = `
  <div class="product-grid">
    <div>
      <img src="${img}" alt="${name}" class="product-img">
    </div>
    <div class="product-info">
      <h1>${name}</h1>
      <p class="price">₦${price}</p>
      
      <div class="section">
        <h3><i class="fa-solid fa-info-circle"></i> Description</h3>
        <p>${desc}</p>
      </div>
      
      <div class="section">
        <h3><i class="fa-solid fa-leaf"></i> Ingredients</h3>
        <p>${ingredients}</p>
      </div>
      
      <div class="section">
        <h3><i class="fa-solid fa-book-medical"></i> How to Use</h3>
        <p>${usage}</p>
      </div>
      
      <button class="buy-btn" onclick="alert('Order placed for ${name}! We will contact you soon.')">
        <i class="fa-solid fa-cart-shopping"></i> Order Now
      </button>
    </div>
  </div>
`;
</script>

</body>
</html>
