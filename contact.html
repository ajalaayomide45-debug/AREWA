<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Arewa Herbal Mixture</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Roboto',Arial,sans-serif;
}

html{
  height:100%;
}

body{
  background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%), url('beach-heart.jpg') no-repeat center fixed;
  background-size: cover;
  background-blend-mode: overlay;
  min-height:100vh;
  width:100%;
}

.header{
  background: rgba(34, 139, 34, 0.95);
  backdrop-filter: blur(10px);
  color:#fff;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  border-bottom: 2px solid rgba(255,255,255,0.3);
  position:sticky;
  top:0;
  z-index:100;
}

.header div:first-child{font-size:22px;font-weight:bold;}
nav{display:flex;gap:25px;align-items:center;flex-wrap:wrap;}
nav div{cursor:pointer;font-size:16px;}
nav div:hover{color:#ffeb3b;}

.container{
  padding:50px 5%;
  min-height: calc(100vh - 70px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.contact-box{
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(12px);
  padding:40px 30px;
  border-radius:20px;
  max-width:600px;
  width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.5);
}

h2{
  color:#228B22;
  text-align:center;
  margin-bottom:10px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:30px;
  font-size:16px;
}

.form-group{
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#333;
  font-weight:600;
  font-size:15px;
}

input, textarea{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
  transition:0.3s;
  background: rgba(255,255,255,0.95);
}

input:focus, textarea:focus{
  border-color:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,0.1);
}

textarea{
  resize:vertical;
  min-height:120px;
}

.btn-submit{
  width:100%;
  padding:15px;
  background:#22c55e;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

.btn-submit:hover{
  background:#16a34a;
  transform:translateY(-2px);
  box-shadow:0 5px 20px rgba(34,197,94,0.4);
}

.contact-info{
  margin-top:30px;
  padding-top:25px;
  border-top:2px solid #eee;
  text-align:center;
}

.contact-info p{
  color:#555;
  margin:8px 0;
  font-size:15px;
}

.contact-info i{
  color:#228B22;
  margin-right:8px;
}

.back-btn{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#228B22;
  text-decoration:none;
  font-weight:600;
  cursor:pointer;
}

.back-btn:hover{
  text-decoration:underline;
}

@media(max-width:768px){
  .header{flex-direction:column;gap:15px;}
  nav{gap:15px;}
  .contact-box{padding:25px 20px;}
  h2{font-size:26px;}
}
</style>
</head>
<body>

<header class="header">
  <div><i class="fa-solid fa-leaf"></i> Arewa Herbal Mixture</div>
  <nav>
    <div onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-house"></i> Home</div>
    <div><i class="fa-solid fa-headset"></i> Contact</div>
    <div onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
  </nav>
</header>

<div class="container">
  <div class="contact-box">
    <h2>Contact Us</h2>
    <p class="subtitle">Have questions about our herbal products? We dey here for you 💚</p>
    
    <form onsubmit="sendMessage(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>
      </div>
      
      <div class="form-group">
        <label>Phone / WhatsApp</label>
        <input type="tel" id="phone" placeholder="080xxxxxxxxx" required>
      </div>
      
      <div class="form-group">
        <label>Message</label>
        <textarea id="message" placeholder="Tell us how we can help you..." required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">
        <i class="fa-brands fa-whatsapp"></i> Send to WhatsApp
      </button>
    </form>
    
    <div class="contact-info">
      <p><i class="fa-solid fa-phone"></i> Call: 09024572231</p>
      <p><i class="fa-brands fa-whatsapp"></i> WhatsApp: 09024572231</p>
      <p><i class="fa-solid fa-location-dot"></i> Lagos, Nigeria</p>
    </div>
    
    <a class="back-btn" onclick="window.location.href='dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i> Back to Products
    </a>
  </div>
</div>

<script>
function sendMessage(e){
  e.preventDefault();
  
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const message = document.getElementById('message').value;
  
  const whatsappText = `Hello Arewa Herbal Mixture%0A%0AName: ${name}%0APhone: ${phone}%0AMessage: ${message}`;
  
  // IMPORTANT: Replace 234XXXXXXXXXX with your WhatsApp number
  // Example: 2348031234567 for 08031234567
  window.open(`https://wa.me/2349024572231?text=${whatsappText}`, '_blank');
}

function logout(){
  window.location.href = 'index.html';
}
</script>

</body>
</html>
